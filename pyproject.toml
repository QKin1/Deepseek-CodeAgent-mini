[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-code-agent"
version = "0.1.0"
description = "A single-agent Windows desktop code generator backed by DeepSeek"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials==6.8.3",
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyInstaller>=6.11,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
